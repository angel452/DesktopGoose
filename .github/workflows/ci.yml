name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift run GooseCoreTests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: "6.3.3"
      - name: Build
        run: swift build
      - name: Test
        run: swift run GooseCoreTests
      - name: Build release app
        run: swift build -c release --product DesktopGooseWin
